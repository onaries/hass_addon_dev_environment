name: Python Development Environment
version: "1.3.1"
slug: python_dev_env
description: "SSH access and Docker CLI for Home Assistant"
url: "https://github.com/onaries/hass_addon_dev_environment"
image: "ksw8954/python-dev-env"
init: false
docker_api: true
full_access: true
host_network: true
startup: services
arch:
  - amd64
ports:
  "2322/tcp": 2322
ports_description:
  "2322/tcp": "SSH port"
map:
  - "config:rw"
  - "ssl:rw"
  - "addons:rw"
  - "backup:rw"
  - share:
      path: "/share"
      read_only: false
  - data:
      path: "/data"
      read_only: false
options:
  ssh_keys: []
  password: ""
  ssh_port: 2322
  username: "developer"
  user_password: ""
  git_name: ""
  git_email: ""
  cliproxy_api_keys: []
  dashboard_port: 8100
  hermes_webui_port: 8787
  fireworks_api_key: ""
  hermes_provider: "openai-codex"
  hermes_model: "gpt-5.5"
schema:
  ssh_keys:
    - str?
  password: str?
  ssh_port: int(1,65535)?
  username: str?
  user_password: str?
  git_name: str?
  git_email: str?
  cliproxy_api_keys:
    - str?
  dashboard_port: int(1,65535)?
  hermes_webui_port: int(1,65535)?
  fireworks_api_key: password?
  hermes_provider: str?
  hermes_model: str?
